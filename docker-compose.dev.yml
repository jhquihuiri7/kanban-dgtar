services:
  app:
    image: kanban-dgtar/app:dev
    container_name: kanban-dev-app
    restart: unless-stopped
    build:
      context: .
      args:
        SKIP_BUILD: "true"
    command: npm run dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban}@host.docker.internal:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-kanban}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-secret-in-production}
      AUTH_COOKIE_SECURE: "false"
      APP_PUBLIC_URL: ${DEV_APP_PUBLIC_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${DEV_GOOGLE_REDIRECT_URI:-http://localhost:3000/api/google/callback}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_DEFAULT_EVENT_DURATION_MINUTES: ${GOOGLE_DEFAULT_EVENT_DURATION_MINUTES:-60}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "${DEV_APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - dev_app_node_modules:/app/node_modules
      - dev_app_next:/app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  dev_app_node_modules:
  dev_app_next:
