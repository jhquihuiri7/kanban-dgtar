services:
  app:
    build:
      context: .
      args:
        SKIP_BUILD: "true"
    command: npm run dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-kanban}@db:5432/${POSTGRES_DB:-kanban}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-secret-in-production}
      AUTH_COOKIE_SECURE: "false"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      GOOGLE_DEFAULT_EVENT_DURATION_MINUTES: ${GOOGLE_DEFAULT_EVENT_DURATION_MINUTES:-60}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next

volumes:
  app_node_modules:
  app_next:
